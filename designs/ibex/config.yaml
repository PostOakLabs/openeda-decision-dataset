  - dir::ibex/vendor/lowrisc_ip/dv/sv/dv_utils

# --------------------------------------------------------------------------
# Timing
# --------------------------------------------------------------------------

CLOCK_PORT: clk_i
CLOCK_PERIOD: 100

PNR_SDC_FILE: dir::constraints/ibex.sdc
SIGNOFF_SDC_FILE: dir::constraints/ibex.sdc

# --------------------------------------------------------------------------
# Floorplan
# --------------------------------------------------------------------------

FP_SIZING: relative
FP_CORE_UTIL: 40
FP_ASPECT_RATIO: 1

# --------------------------------------------------------------------------
# Flow behaviour
# --------------------------------------------------------------------------

# This repository exists to provoke and measure failures, not to ship silicon.
# Congestion must therefore be reported as a metric rather than aborting the
# run at global routing: a sweep that dies at GRT produces no metrics to write
# an episode about. Timing and congestion problems are recorded; DRC and LVS
# errors still stop the flow, because there is nothing downstream of them
# worth measuring.
GRT_ALLOW_CONGESTION: true

# --------------------------------------------------------------------------
# A note on overriding
# --------------------------------------------------------------------------
#
# Every value above is at the top level on purpose, with no `pdk::` or `scl::`
# conditional blocks. A sweep in flow/sweeps/ is a second configuration file
# layered on top of this one, and a conditional block in the baseline is
# evaluated per file -- which makes the precedence of a plain top-level
# override in the sweep ambiguous. Keeping the baseline flat keeps every sweep
# a genuinely single-variable change.
