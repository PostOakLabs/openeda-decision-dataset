# SPDX-License-Identifier: Apache-2.0
#
# LibreLane configuration -- Ibex on sky130A.
#
# The flow is LibreLane. The place-and-route engine inside it is OpenROAD.
#
# Everything in this file is deliberately boring. It is a BASELINE: one
# relaxed run that should complete cleanly, so that every sweep under
# flow/sweeps/ has something to be a single-variable perturbation OF.
#
# The RTL is a git submodule pinned in designs/ibex/ibex; see rtl.pin for the
# exact commit and for how the file list below was derived. Paths are relative
# to this file's directory (LibreLane resolves them against DESIGN_DIR).
#
# Units: CLOCK_PERIOD is nanoseconds. FP_CORE_UTIL is a percentage.

DESIGN_NAME: ibex_top
PDK: sky130A
STD_CELL_LIBRARY: sky130_fd_sc_hd

